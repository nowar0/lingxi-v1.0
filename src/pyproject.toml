[project]
name = "lingxi-app"
version = "1.0.0"
description = "零汐：本地运行的数字伙伴与任务助手"
readme = "README.md"
authors = [
    { name = "nowar0", email = "193066979+nowar0@users.noreply.github.com" }
]
requires-python = ">=3.14"
dependencies = [
    "pywinpty==3.1.2; sys_platform == 'win32'",
    "sqlite-vec==0.1.9",
    "sherpa-onnx==2.0.1",
    "asyncssh[bcrypt,pywin32]==2.24.1",
    "fastapi>=0.141.1",
    "keyring>=25.7.0",
    "mcp>=2.3.0",
    "numpy>=2.5.4",
    "onnxruntime>=1.31.0",
    "openai>=3.19.2",
    "playwright>=1.64.0",
    "pillow==13.0.0",
    "pypdf==6.21.4",
    "python-dotenv>=1.2.3",
    "pyyaml>=6.0.3",
    "tokenizers>=0.23.3",
    "uvicorn[standard]>=0.54.0",
]

# Release/install compatibility refers to PRAGMA user_version, not app version.
# Unknown/older releases without this declaration remain unknown to rollback tools.
[tool.lingxi.data-schema]
min = 0
max = 4
target = 4

[tool.uv]
package = false

[dependency-groups]
dev = [
    "pyinstaller>=6.22.3",
    "ruff>=0.16.9",
]

[tool.ruff]
line-length = 100      # 一行最多 100 个字符

[tool.ruff.lint]
select = ["E", "W", "F", "I"]
