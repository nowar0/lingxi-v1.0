<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>关闭零汐</title><style>
*{box-sizing:border-box}body{margin:0;background:#fff;color:#181818;font:14px/1.6 "Microsoft YaHei UI",sans-serif;padding:26px}h1{font-size:21px;line-height:1.4;margin:0;font-weight:600}.top{display:flex;align-items:center;gap:10px}.top img{width:25px;height:29px}.top h1{margin:0}.close{position:absolute;right:18px;top:15px;background:transparent;border:0;font-size:23px;cursor:pointer;color:#484848;width:30px;height:30px;border-radius:6px}.close:hover{background:#eee}p{margin:16px 0 18px;color:#444}.remember{display:flex;align-items:center;gap:10px;margin-bottom:20px;cursor:pointer}.remember input{appearance:none;width:38px;height:22px;border-radius:12px;border:1px solid #c9c9c9;background:#eee;position:relative;margin:0}.remember input:before{content:'';position:absolute;width:17px;height:17px;border-radius:50%;background:#fff;top:1px;left:1px;box-shadow:0 1px 3px #0002;transition:transform .15s}.remember input:checked{background:#222;border-color:#222}.remember input:checked:before{transform:translateX(16px)}.actions{display:flex;gap:12px}.actions button{height:48px;flex:1;border-radius:10px;font:inherit;font-weight:600;cursor:pointer;border:1px solid #d4d4d4;background:#f5f5f5;color:#222}.actions button:first-child{background:#202020;color:white;border-color:#202020}.actions button:disabled{opacity:.5;cursor:default}button:focus-visible,input:focus-visible{outline:2px solid #444;outline-offset:3px}.error{font-size:12px;color:#555;margin-top:8px}.error:empty{display:none}
</style></head><body><button class="close" aria-label="取消关闭">×</button><div class="top"><img src="assets/lingxi-brand.svg" alt="零汐"><h1>请选择后续操作</h1></div><p>你可以退出程序，或让零汐继续在系统托盘中运行。</p><label class="remember"><input id="remember" type="checkbox">记住选项</label><div class="actions"><button data-choice="tray">最小化到托盘</button><button data-choice="exit">退出程序</button></div><div class="error" role="alert"></div><script>
const choose=async action=>{document.querySelectorAll('button').forEach(b=>b.disabled=true);try{const v=await window.LingxiShell.closeChoice({action,remember:document.querySelector('#remember').checked});if(v?.error)throw Error('操作未完成，请重试')}catch(e){document.querySelector('[role=alert]').textContent=e.message;document.querySelectorAll('button').forEach(b=>b.disabled=false)}};document.querySelector('.close').onclick=()=>choose('cancel');document.querySelectorAll('[data-choice]').forEach(b=>b.onclick=()=>choose(b.dataset.choice));addEventListener('keydown',e=>{if(e.key==='Escape')choose('cancel')});
</script></body></html>
