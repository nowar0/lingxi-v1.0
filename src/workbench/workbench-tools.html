<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>工作工具 · 零汐</title>
  <link rel="stylesheet" href="./assets/workbench/workbench.css">
  <style>
    :root{color-scheme:light;--paper:#fff;--ink:#171717;--muted:#737373;--line:#e5e5e5;--soft:#f5f5f5;--accent:#171717}
    :root[data-theme="dark"]{color-scheme:dark;--paper:#171717;--ink:#f5f5f5;--muted:#a3a3a3;--line:#404040;--soft:#262626;--accent:#f5f5f5}
    html,body,#root{height:100%;margin:0}body{background:var(--paper);font-family:Inter,"Microsoft YaHei",sans-serif}
  </style>
</head>
<body>
  <div id="root"></div>
  <script type="module">
    import {mount} from "./assets/workbench/workbench.js";
    const query=new URLSearchParams(location.search);
    const tab=query.get('tab')||'git';
    const sessionId=Number(query.get('session_id'))||0;
    const jobId=query.get('job_id')||undefined;
    const send=(data)=>parent.postMessage(data,location.origin);
    window.LingxiWorkbench={open:(name)=>send({type:'lingxi-tools-open',tab:name})};
    addEventListener('message',(event)=>{
      if(event.origin!==location.origin||event.source!==parent||event.data?.type!=='lingxi-tools-theme')return;
      for(const [name,value] of Object.entries(event.data.colors||{})){
        if(['paper','ink','muted','line','soft','accent'].includes(name)&&typeof value==='string')document.documentElement.style.setProperty('--'+name,value);
      }
      document.documentElement.dataset.theme=event.data.dark?'dark':'light';
      window.LingxiWorkbenchTheme?.apply();
    });
    mount(document.getElementById('root'),{initialTab:tab,sid:sessionId,jobId,onChat:()=>send({type:'lingxi-tools-close'})});
  </script>
</body>
</html>
